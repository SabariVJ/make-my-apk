name: CI

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main, release/*]

permissions:
  contents: read

jobs:
  web-checks:
    name: Web Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Tests
        run: bun run test
      - name: ESLint
        run: bunx eslint src/
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: Prettier check
        run: bunx prettier --check "src/**/*.{ts,tsx,css}"
      - name: Build
        run: bun run build
      - name: Git clean
        run: git diff --check

  reward-database:
    name: Reward Database (native PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: svj_rewards_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d svj_rewards_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SVJ_REWARD_TEST_DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:5432/svj_rewards_test
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Native reward transaction and RLS tests
        run: bun run test:rewards:postgres

  # The SVJ phone app (Capacitor + native plugins).
  android-phone:
    name: Android Phone Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Build web assets
        run: bun run build
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare Capacitor assets directory
        run: mkdir -p android/app/src/main/assets
      - name: Capacitor sync
        run: bun run cap:sync
      - name: Android theme regression tests
        run: python3 scripts/test_android_themes.py
      - name: Android unit tests (phone plugins)
        run: cd android && ./gradlew :app:testDebugUnitTest
      - name: Android lint
        run: cd android && ./gradlew :app:lintDebug
      - name: Upload Android lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-reports
          path: |
            android/app/build/reports/lint-results-debug.*
            android/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: warn
      - name: Android assembleDebug (phone)
        run: cd android && ./gradlew :app:assembleDebug
      - name: Upload phone APK
        uses: actions/upload-artifact@v7
        with:
          name: svj-phone-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # The SVJ Wear OS companion (native Kotlin, same repository).
  wear-os:
    name: Wear OS Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # The watch app is a plain Kotlin module, but the Gradle build still
      # configures the Capacitor phone module, which needs both the Node
      # dependencies and the generated Cordova/Capacitor files from `cap sync`.
      - run: bun install --frozen-lockfile
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare Capacitor assets directory
        run: mkdir -p android/app/src/main/assets
      - name: Capacitor sync
        run: bun run cap:sync
      - name: Wear OS unit tests
        run: cd android && ./gradlew :wear:testDebugUnitTest
      - name: Android lint (wear)
        run: cd android && ./gradlew :wear:lintDebug
      - name: Android assembleDebug (wear)
        run: cd android && ./gradlew :wear:assembleDebug
      - name: Upload Wear OS APK
        uses: actions/upload-artifact@v7
        with:
          name: svj-wear-debug-apk
          path: android/wear/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Release PREPARATION only — nothing here publishes to Google Play. It builds
  # upload-ready release App Bundles, proves phone and wear share one signing
  # identity, and emits a safe metadata report. Signing uses an ephemeral
  # CI-generated validation keystore unless SVJ production secrets are present;
  # the certificate fingerprint in the report is all that is logged.
  android-release-validation:
    name: Android Release Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare Capacitor assets directory
        run: mkdir -p android/app/src/main/assets
      - name: Capacitor sync
        run: bun run cap:sync
      - name: Provision signing identity
        env:
          SVJ_KEYSTORE_PATH_B64: ${{ secrets.SVJ_KEYSTORE_PATH_B64 }}
          SVJ_KEYSTORE_PASSWORD: ${{ secrets.SVJ_KEYSTORE_PASSWORD }}
          SVJ_KEY_ALIAS: ${{ secrets.SVJ_KEY_ALIAS }}
          SVJ_KEY_PASSWORD: ${{ secrets.SVJ_KEY_PASSWORD }}
        run: |
          if [ -n "$SVJ_KEYSTORE_PATH_B64" ]; then
            echo "$SVJ_KEYSTORE_PATH_B64" | base64 -d > /tmp/svj-release.keystore
            echo "Using provided upload keystore."
          else
            # Ephemeral validation keystore — clearly not the production upload
            # key. Fingerprints of BOTH artifacts are compared against each
            # other, which is the invariant release preparation must prove.
            keytool -genkeypair -v \
              -keystore /tmp/svj-release.keystore -storepass svj-validation-only \
              -alias svj-validation -keyalg RSA -keysize 2048 -validity 1 \
              -dname "CN=SVJ Validation (not for release), O=SVJ"
            SVJ_KEYSTORE_PASSWORD=svj-validation-only
            SVJ_KEY_ALIAS=svj-validation
            SVJ_KEY_PASSWORD=svj-validation-only
            echo "No production keystore configured; using an EPHEMERAL VALIDATION key (artifacts are not release-signable)."
          fi
          echo "SVJ_KEYSTORE_PATH=/tmp/svj-release.keystore" >> "$GITHUB_ENV"
          echo "SVJ_KEYSTORE_PASSWORD=$SVJ_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SVJ_KEY_ALIAS=$SVJ_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SVJ_KEY_PASSWORD=$SVJ_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Phone release bundle
        run: cd android && ./gradlew :app:bundleRelease
      - name: Wear release bundle
        run: cd android && ./gradlew :wear:bundleRelease
      - name: Release unit tests
        run: cd android && ./gradlew :app:testReleaseUnitTest :wear:testReleaseUnitTest
      - name: Verify phone and wear share one signing identity
        run: |
          PHONE_AAB=$(ls android/app/build/outputs/bundle/release/*.aab)
          WEAR_AAB=$(ls android/wear/build/outputs/bundle/release/*.aab)
          keytool -printcert -jarfile "$PHONE_AAB" | grep "SHA256:" | head -1 | sed 's/^/phone:    /' > /tmp/fingerprints.txt
          keytool -printcert -jarfile "$WEAR_AAB" | grep "SHA256:" | head -1 | sed 's/^/wear:     /' >> /tmp/fingerprints.txt
          cat /tmp/fingerprints.txt
          P=$(grep '^phone:' /tmp/fingerprints.txt | awk '{print $2}')
          W=$(grep '^wear:' /tmp/fingerprints.txt | awk '{print $2}')
          if [ "$P" != "$W" ]; then
            echo "::error::Phone and Wear release artifacts have DIFFERENT signing certificates — the Wear OS Data Layer will not connect."
            exit 1
          fi
      - name: Release metadata report
        run: |
          PHONE_AAB=$(ls android/app/build/outputs/bundle/release/*.aab)
          WEAR_AAB=$(ls android/wear/build/outputs/bundle/release/*.aab)
          {
            echo "git SHA:            $(git rev-parse HEAD)"
            echo "phone app id:       app.lovable.svj"
            echo "wear app id:        app.lovable.svj"
            echo "phone versionCode:  100100  versionName: 1.0  targetSdk 36  minSdk 24"
            echo "wear  versionCode:  200100  versionName: 1.0  targetSdk 36  minSdk 26"
            grep "SHA256:" /tmp/fingerprints.txt | head -1 | sed 's/^/cert /'
            echo "phone AAB: $(basename "$PHONE_AAB")  sha256=$(sha256sum "$PHONE_AAB" | awk '{print $1}')"
            echo "wear  AAB: $(basename "$WEAR_AAB")  sha256=$(sha256sum "$WEAR_AAB" | awk '{print $1}')"
          } | tee release-metadata.txt
      - name: Upload phone release AAB
        uses: actions/upload-artifact@v7
        with:
          name: svj-phone-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Upload wear release AAB
        uses: actions/upload-artifact@v7
        with:
          name: svj-wear-release-aab
          path: android/wear/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Upload release metadata report
        uses: actions/upload-artifact@v7
        with:
          name: svj-release-metadata
          path: release-metadata.txt
          if-no-files-found: error
