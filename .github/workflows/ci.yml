name: CI

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main, release/*]

permissions:
  contents: read

jobs:
  web-checks:
    name: Web Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm test
      - name: ESLint
        run: npx eslint src/
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Prettier check
        run: npx prettier --check "src/**/*.{ts,tsx,css}"
      - name: Build
        run: npm run build
      - name: Git clean
        run: git diff --check

  reward-database:
    name: Reward Database (native PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: svj_rewards_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d svj_rewards_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SVJ_REWARD_TEST_DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:5432/svj_rewards_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Native reward transaction and RLS tests
        run: npm run test:rewards:postgres

  android-debug:
    name: Android Debug Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build web assets
        run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare Capacitor assets directory
        run: mkdir -p android/app/src/main/assets
      - name: Capacitor sync
        run: npm run cap:sync
      - name: Android theme regression tests
        run: python3 scripts/test_android_themes.py
      - name: Android lint
        run: cd android && ./gradlew lintDebug
      - name: Upload Android lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: |
            android/app/build/reports/lint-results-debug.*
            android/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: warn
      - name: Android assembleDebug
        run: cd android && ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
