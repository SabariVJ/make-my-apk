apply plugin: 'com.android.application'
// Kotlin is required only for the Health Connect bridge: the Health Connect
// client's read APIs are coroutine-based.
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "app.lovable.svj"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.lovable.svj"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def keystorePath = System.getenv('SVJ_KEYSTORE_PATH') ?: ''
            def keystorePassword = System.getenv('SVJ_KEYSTORE_PASSWORD') ?: ''
            def keyAlias = System.getenv('SVJ_KEY_ALIAS') ?: ''
            def keyPassword = System.getenv('SVJ_KEY_PASSWORD') ?: ''

            def allPresent = keystorePath && keystorePassword && keyAlias && keyPassword
            if (allPresent) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAlias
                keyPassword keyPassword
            }
        }
    }

    buildTypes {
        release {
            // Fail explicitly when signing credentials are missing so an
            // unsigned release AAB is never silently produced.
            signingConfig signingConfigs.release
            def keystorePath = System.getenv('SVJ_KEYSTORE_PATH') ?: ''
            def keystorePassword = System.getenv('SVJ_KEYSTORE_PASSWORD') ?: ''
            def keyAlias = System.getenv('SVJ_KEY_ALIAS') ?: ''
            def keyPassword = System.getenv('SVJ_KEY_PASSWORD') ?: ''
            def signingReady = keystorePath && keystorePassword && keyAlias && keyPassword
            project.gradle.taskGraph.whenReady { graph ->
                if (signingReady) return
                // Match only the app project's release artifact tasks.
                // Debug, help, sync, lint, install, test tasks must not require credentials.
                // `task.path` is the fully-qualified task path (e.g. ':app:assembleRelease').
                // Task has no `projectPath` property, so match on the supported
                // `path` / `name` properties instead.
                def needsReleaseSigning = graph.allTasks.any { task ->
                    task.path.startsWith(':app:') &&
                    (task.name ==~ /assembleRelease.*/ || task.name ==~ /bundleRelease.*/)
                }
                if (needsReleaseSigning) {
                    throw new GradleException(
                        'Release signing requires SVJ_KEYSTORE_PATH, SVJ_KEYSTORE_PASSWORD, ' +
                        'SVJ_KEY_ALIAS, and SVJ_KEY_PASSWORD environment variables. ' +
                        'Set them before building a release artifact.'
                    )
                }
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Android's on-device Health Connect store (not a third-party service).
    implementation "androidx.health.connect:connect-client:$healthConnectVersion"

    // Wear OS Data Layer: discovery of, and messaging with, the SVJ Wear OS
    // companion app that ships from this same repository (module `:wear`).
    implementation "com.google.android.gms:play-services-wearable:$playServicesWearableVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlinxCoroutinesVersion"
}

// Match the module's Java 21 target so the Kotlin and Java compilations agree.
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "21"
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
