// SVJ Wear OS companion.
//
// A native Kotlin Wear OS app that lives in the same repository as the SVJ
// phone app and talks to it over the Wear OS Data Layer. It is deliberately
// independent of Capacitor: the watch never loads the web app, and the phone
// module is untouched by this module's dependencies.
//
// The UI is built with the framework views rather than Compose for Wear OS:
// this project is built inside a memory-constrained container where the plain
// Android toolchain already has to be run with a reduced heap and a single
// worker, and adding a second full UI toolchain (Compose compiler + runtime)
// to the build would risk the phone build as well. Views are a fully supported
// Wear OS approach and keep the watch APK small, which matters for watch
// battery and install size.
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    // The Kotlin/Java sources live under app.lovable.svj.wear — the namespace is
    // purely a source/R-class organization concern. The APPLICATION ID must be
    // identical to the SVJ phone app: the Wear OS Data Layer only routes
    // messages between nodes whose apps share the same package AND signing
    // certificate. See docs/SVJ_GOOGLE_PLAY_WEAR_RELEASE.md.
    namespace = "app.lovable.svj.wear"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        // Same Play application identity as the phone module (required for the
        // Data Layer, and the same Play listing serves both form factors).
        applicationId "app.lovable.svj"
        // Wear OS 3 / API 30 is the practical floor for phones paired with SVJ;
        // 26 keeps the module buildable against the same toolchain while the
        // runtime features used (sensors, foreground service, Data Layer) are
        // all available well below it.
        minSdk = 26
        targetSdk = rootProject.ext.targetSdkVersion
        // Form-factor-prefixed versioning: wear builds use the 200000 band so
        // phone (100000 band) and watch version codes can never collide. See
        // docs/SVJ_GOOGLE_PLAY_WEAR_RELEASE.md for the scheme.
        versionCode 200100
        versionName "1.0"
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('SVJ_KEYSTORE_PATH') ?: ''
            def keystorePassword = System.getenv('SVJ_KEYSTORE_PASSWORD') ?: ''
            def keyAliasEnv = System.getenv('SVJ_KEY_ALIAS') ?: ''
            def keyPasswordEnv = System.getenv('SVJ_KEY_PASSWORD') ?: ''
            if (keystorePath && keystorePassword && keyAliasEnv && keyPasswordEnv) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasEnv
                keyPassword keyPasswordEnv
            }
        }
    }

    buildTypes {
        release {
            // Fail explicitly when signing credentials are missing so an
            // unsigned (or debug-signed) watch AAB is never silently produced.
            signingConfig signingConfigs.release
            def keystorePath = System.getenv('SVJ_KEYSTORE_PATH') ?: ''
            def keystorePassword = System.getenv('SVJ_KEYSTORE_PASSWORD') ?: ''
            def keyAliasEnv = System.getenv('SVJ_KEY_ALIAS') ?: ''
            def keyPasswordEnv = System.getenv('SVJ_KEY_PASSWORD') ?: ''
            def signingReady = keystorePath && keystorePassword && keyAliasEnv && keyPasswordEnv
            project.gradle.taskGraph.whenReady { graph ->
                if (signingReady) return
                def needsReleaseSigning = graph.allTasks.any { task ->
                    task.path.startsWith(':wear:') &&
                    (task.name ==~ /assembleRelease.*/ || task.name ==~ /bundleRelease.*/)
                }
                if (needsReleaseSigning) {
                    throw new GradleException(
                        'Wear release signing requires SVJ_KEYSTORE_PATH, SVJ_KEYSTORE_PASSWORD, ' +
                        'SVJ_KEY_ALIAS, and SVJ_KEY_PASSWORD environment variables. ' +
                        'Set them before building a release artifact.'
                    )
                }
            }
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "17"
    }
}

    // Release AABs for the Wear OS dedicated Play track share the phone
    // module's signing identity (same env-driven config; Play App Signing
    // re-signs distributed artifacts in the Console).
    dependencies {
    // Wear OS Data Layer (capability/node discovery, messages, durable outbox).
    implementation "com.google.android.gms:play-services-wearable:$playServicesWearableVersion"
    // NotificationCompat for the ongoing workout notification.
    implementation "androidx.core:core:$androidxCoreVersion"

    testImplementation "junit:junit:$junitVersion"
}
