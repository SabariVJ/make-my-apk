<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="robots" content="noindex" />
    <title>Page Not Found — SVJ</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <style>
      :root {
        --ink: #0b0b0c;
        --panel: #141416;
        --line: #2a2a2e;
        --paper: #f4f2ed;
        --muted: #8e8e96;
        --crimson: #c81e3a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        display: grid;
        min-height: 100svh;
        place-items: center;
        margin: 0;
        padding: 1.5rem;
        color: var(--paper);
        background: var(--ink);
        font-family: "IBM Plex Mono", monospace;
      }
      main {
        width: min(620px, 100%);
        padding: clamp(1.5rem, 7vw, 4rem);
        border: 1px solid var(--line);
        background: var(--panel);
        box-shadow: 12px 12px 0 #1b1013;
      }
      p {
        color: var(--muted);
        font-size: 0.75rem;
        line-height: 1.7;
        letter-spacing: 0.05em;
      }
      .code {
        color: var(--crimson);
        font-size: 0.68rem;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }
      h1 {
        max-width: 7ch;
        margin: 0.8rem 0 1.2rem;
        font:
          400 clamp(4rem, 16vw, 8rem)/0.79 Anton,
          Impact,
          sans-serif;
        letter-spacing: 0.015em;
        text-transform: uppercase;
      }
      a {
        display: inline-block;
        margin-top: 1.25rem;
        padding: 0.82rem 1rem;
        border: 1px solid var(--crimson);
        color: var(--paper);
        background: var(--crimson);
        font-size: 0.68rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-decoration: none;
        text-transform: uppercase;
      }
      a:focus-visible {
        outline: 3px solid #d7c11f;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Error / 404</p>
      <h1>This page is not in the plan.</h1>
      <p>
        The link has moved or does not exist. Return to the SVJ landing page and choose your next
        action.
      </p>
      <a href="/landing.html">Return to SVJ</a>
    </main>
  </body>
</html>
